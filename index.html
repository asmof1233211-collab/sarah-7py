
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مؤقت الكوادة الفعلية</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: system-ui, sans-serif;
    background-color: #f8fafc;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #0f172a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    text-align: center;
    transition: background-image 0.3s;
}

.container {
    background: rgba(255,255,255,0.93);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    width: 100%;
    max-width: 350px;
    backdrop-filter: blur(10px);
}

h1 {
    color: #1e3a8a;
    font-size: 24px;
}

#timer {
    font-size: 64px;
    font-weight: bold;
    margin: 20px 0;
    color: #0f172a;
    font-variant-numeric: tabular-nums;
}

#status {
    color: #475569;
    margin-bottom: 25px;
}

.buttons {
    display: flex;
    gap: 10px;
}

button {
    border: none;
    padding: 12px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    flex: 1;
}

#startBtn { background: #16a34a; }
#pauseBtn { background: #d97706; }
#resetBtn { background: #dc2626; }

.settings {
    margin-top: 20px;
    border-top: 1px solid #ddd;
    padding-top: 18px;
}

.settings h3 {
    margin-top: 0;
    color: #1e3a8a;
}

#bgUpload {
    width: 100%;
    margin: 12px 0;
    font-size: 13px;
}

#preview {
    width: 100%;
    height: 100px;
    object-fit: cover;
    border-radius: 10px;
    display: none;
    margin-bottom: 10px;
}

#resetBackground {
    background: #334155;
    width: 100%;
}

</style>
</head>

<body>

<div class="container">

    <h1>مؤقت الدراسة الذكي</h1>

    <div id="timer">25:00</div>

    <div id="status">
        جاهز لبدء جلسة المذاكرة
    </div>

    <div class="buttons">
        <button id="startBtn" onclick="startTimer()">بدء</button>
        <button id="pauseBtn" onclick="pauseTimer()">إيقاف</button>
        <button id="resetBtn" onclick="resetTimer()">إعادة</button>
    </div>

    <div class="settings">

        <h3>⚙️ إعدادات الخلفية</h3>

        <p>اختر صورة من معرض هاتفك</p>

        <input
            type="file"
            id="bgUpload"
            accept="image/*"
        >

        <img id="preview" alt="معاينة الخلفية">

        <button
            id="resetBackground"
            onclick="resetBackground()">
            استعادة الخلفية الأصلية
        </button>

    </div>

</div>

<script>

// المؤقت
let timeLeft = 25 * 60;
let timerId = null;

function updateDisplay() {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;

    document.getElementById('timer').textContent =
        `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
}

function startTimer() {
    if (timerId !== null) return;

    document.getElementById('status').textContent =
        "جلسة مذاكرة جارية... ركز!";

    timerId = setInterval(() => {
        if (timeLeft > 0) {
            timeLeft--;
            updateDisplay();
        } else {
            clearInterval(timerId);
            timerId = null;

            document.getElementById('status').textContent =
                "انتهت الجلسة! خذ استراحة 5 دقائق";

            alert("أحسنت! انتهت جلسة المذاكرة.");
        }
    }, 1000);
}

function pauseTimer() {
    clearInterval(timerId);
    timerId = null;

    document.getElementById('status').textContent =
        "المؤقت متوقف مؤقتاً";
}

function resetTimer() {
    clearInterval(timerId);
    timerId = null;
    timeLeft = 25 * 60;

    updateDisplay();

    document.getElementById('status').textContent =
        "جاهز لبدء جلسة المذاكرة";
}

// تغيير الخلفية وحفظها
const bgUpload = document.getElementById('bgUpload');
const preview = document.getElementById('preview');

function applyBackground(image) {
    document.body.style.backgroundImage =
        `url("${image}")`;

    preview.src = image;
    preview.style.display = 'block';
}

bgUpload.addEventListener('change', function() {

    const file = this.files[0];

    if (!file) return;

    if (!file.type.startsWith('image/')) {
        alert("يرجى اختيار صورة صحيحة");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

        const image = e.target.result;

        try {
            localStorage.setItem('myBackground', image);
            applyBackground(image);
        } catch (error) {
            alert("الصورة كبيرة جداً، حاول اختيار صورة أصغر.");
        }
    };

    reader.readAsDataURL(file);
});

// استرجاع الخلفية المحفوظة
window.addEventListener('load', function() {

    const savedBackground =
        localStorage.getItem('myBackground');

    if (savedBackground) {
        applyBackground(savedBackground);
    }

});

// استعادة الخلفية الأصلية
function resetBackground() {

    localStorage.removeItem('myBackground');

    document.body.style.backgroundImage = '';

    preview.style.display = 'none';
    preview.src = '';

    bgUpload.value = '';
}

updateDisplay();

</script>
<!-- زر فتح الخلفيات -->
<button onclick="toggleWallpapers()" style="padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 8px; border: none; background: #0f172a; color: white;">
    🖼️ اختر الخلفية
</button>

<!-- قائمة الخلفيات (مخفية وتظهر عند الضغط على الزر) -->
<div id="wallpaperMenu" style="display: none; margin-top: 15px; gap: 10px; justify-content: center; flex-wrap: wrap;">
    <img src="Screenshot_٢٠٢٦١١١٩-١٧٤٣٠٩.jpg" onclick="changeBg(this.src)" width="80" height="80" style="cursor: pointer; border-radius: 8px; object-fit: cover; border: 2px solid #0f172a;">
    <img src="Screenshot_٢٠٢٦١١١٩-١٧٤٢٣٨.jpg" onclick="changeBg(this.src)" width="80" height="80" style="cursor: pointer; border-radius: 8px; object-fit: cover; border: 2px solid #0f172a;">
    <img src="Screenshot_٢٠٢٦١١١٩-١٧٤٢٠٨.jpg" onclick="changeBg(this.src)" width="80" height="80" style="cursor: pointer; border-radius: 8px; object-fit: cover; border: 2px solid #0f172a;">
    <img src="Screenshot_٢٠٢٦١١١٩-١٧٤١٢٤.jpg" onclick="changeBg(this.src)" width="80" height="80" style="cursor: pointer; border-radius: 8px; object-fit: cover; border: 2px solid #0f172a;">
    <img src="Screenshot_٢٠٢٦١١١٩-١٨٢٧٣٢.jpg" onclick="changeBg(this.src)" width="80" height="80" style="cursor: pointer; border-radius: 8px; object-fit: cover; border: 2px solid #0f172a;">
    <img src="Screenshot_٢٠٢٦١١١٩-١٨٢٦٥٢.jpg" onclick="changeBg(this.src)" width="80" height="80" style="cursor: pointer; border-radius: 8px; object-fit: cover; border: 2px solid #0f172a;">
    <img src="Screenshot_٢٠٢٦١١١٩-١٨٢٥٥٩.jpg" onclick="changeBg(this.src)" width="80" height="80" style="cursor: pointer; border-radius: 8px; object-fit: cover; border: 2px solid #0f172a;">
</div>
    
<script>
    // دالة فتح وإغلاق قائمة الخلفيات
    function toggleWallpapers() {
        var menu = document.getElementById("wallpaperMenu");
        if (menu.style.display === "none") {
            menu.style.display = "flex";
        } else {
            menu.style.display = "none";
        }
    }

    // دالة تغيير خلفية الموقع للصورة المختارة
    function changeBg(imageSrc) {
        document.body.style.backgroundImage = "url('" + imageSrc + "')";
    }
</script>
<!-- أزرار تكبير وتصغير الخلفية -->
<div style="text-align: center; margin: 20px;">
    <button onclick="zoomBg(10)" style="padding: 10px 15px; font-size: 16px; cursor: pointer; border-radius: 8px; background: #2563eb; color: white; border: none; margin-left: 5px;">
        ➕ تكبير الخلفية
    </button>
    <button onclick="zoomBg(-10)" style="padding: 10px 15px; font-size: 16px; cursor: pointer; border-radius: 8px; background: #0f172a; color: white; border: none; margin-left: 5px;">
        ➖ تصغير الخلفية
    </button>
</div>

<!-- كود التشغيل -->
<script>
    let currentSize = 100; // الحجم الافتراضي

    function zoomBg(amount) {
        currentSize += amount;
        if (currentSize < 20) currentSize = 20; // أقل حد للتصغير
        document.body.style.backgroundSize = currentSize + "%";
        document.body.style.backgroundRepeat = "no-repeat";
        document.body.style.backgroundPosition = "center";
    }
</script>
<!-- أزرار التحكم بشفافية الصندوق أو المحتوى -->
<div style="text-align: center; margin: 20px;">
    <p style="color: white; margin-bottom: 5px;">شفافية المحتوى:</p>
    <button onclick="changeOpacity(0.3)" style="padding: 8px 12px; cursor: pointer; border-radius: 6px; background: #2563eb; color: white; border: none;">شفاف جداً</button>
    <button onclick="changeOpacity(0.7)" style="padding: 8px 12px; cursor: pointer; border-radius: 6px; background: #2563eb; color: white; border: none;">متوسط</button>
    <button onclick="changeOpacity(1)" style="padding: 8px 12px; cursor: pointer; border-radius: 6px; background: #2563eb; color: white; border: none;">واضح كلياً</button>
</div>

<!-- كود التشغيل -->
<script>
    function changeOpacity(val) {
        // هنا نقصد الصندوق الرئيسي أو الحاوية التي تضم محتوى موقعك (تأكد أن الـ id يطابق ما موجود في موقعك، أو اجعلها على الـ body مع استخدام rgba للخلفية)
        let container = document.querySelector('.container') || document.body;
        
        // إذا أردت التأثير على الصندوق فقط دون تأثيرات جانبية على الخلفية:
        container.style.opacity = val;
    }
</script>
<!-- زر معاينة الخلفية فقط -->
<div style="text-align: center; margin: 20px; position: relative; z-index: 999;">
    <button onclick="togglePreview()" id="previewBtn" style="padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 8px; background: #0f172a; color: white; border: none;">
        👁️ معاينة الخلفية فقط
    </button>
</div>

<!-- كود التشغيل للمعاينة -->
<script>
    let isPreviewing = false;

    function togglePreview() {
        // تحديد الصندوق الرئيسي أو محتوى الصفحة
        let container = document.querySelector('.container') || document.body;
        let btn = document.getElementById('previewBtn');
        
        // استثناء زر المعاينة نفسه لكي يبقى ظاهراً وتستطيع إرجاع الشاشة
        let allElements = document.body.children;

        if (!isPreviewing) {
            // إخفاء كل محتويات الصفحة عدا أزرار التحكم
            for (let i = 0; i < allElements.length - 1; i++) {
                allElements[i].style.opacity = '0';
                allElements[i].style.pointerEvents = 'none';
            }
            btn.style.opacity = '1';
            btn.style.pointerEvents = 'auto';
            btn.innerText = '❌ إيقاف المعاينة';
            isPreviewing = true;
        } else {
            // إرجاع المحتوى كما كان
            for (let i = 0; i < allElements.length - 1; i++) {
                allElements[i].style.opacity = '1';
                allElements[i].style.pointerEvents = 'auto';
            }
            btn.innerText = '👁️ معاينة الخلفية فقط';
            isPreviewing = false;
        }
    }
</script>

</body>
</html>
