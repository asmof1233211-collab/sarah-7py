<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤقت الكوادة الفعلية</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 85%;
            max-width: 350px;
        }
        h1 {
            color: #1e3a8a;
            font-size: 24px;
            margin-bottom: 10px;
        }
        #timer {
            font-size: 64px;
            font-weight: bold;
            margin: 20px 0;
            color: #0f172a;
            font-variant-numeric: tabular-nums;
        }
        #status {
            color: #475569;
            font-size: 16px;
            margin-bottom: 25px;
        }
        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            border: none;
            padding: 12px 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            flex: 1;
        }
        #startBtn { background-color: #16a34a; }
        #pauseBtn { background-color: #d97706; }
        #resetBtn { background-color: #dc2626; }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>

<div class="container">
    <h1>مؤقت الدراسة الذكي</h1>
    <div id="timer">25:00</div>
    <div id="status">جاهز لبدء جلسة المذاكرة</div>
    <div class="buttons">
        <button id="startBtn" onclick="startTimer()">بدء</button>
        <button id="pauseBtn" onclick="pauseTimer()">إيقاف</button>
        <button id="resetBtn" onclick="resetTimer()">إعادة</button>
    </div>
</div>

<script>
    let timeLeft = 25 * 60; // 25 دقيقة بالثواني
    let timerId = null;

    function updateDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        document.getElementById('timer').textContent = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function startTimer() {
        if (timerId !== null) return;
        document.getElementById('status').textContent = "جلسة مذاكرة جارية... ركز!";
        timerId = setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                updateDisplay();
            } else {
                clearInterval(timerId);
                timerId = null;
                document.getElementById('status').textContent = "انتهت الجلسة! خذ استراحة 5 دقائق";
                alert("أحسنت! انتهت جلسة المذاكرة (25 دقيقة).");
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerId);
        timerId = null;
        document.getElementById('status').textContent = "المؤقت متوقف مؤقتاً";
    }

    function resetTimer() {
        clearInterval(timerId);
        timerId = null;
        timeLeft = 25 * 60;
        updateDisplay();
        document.getElementById('status').textContent = "جاهز لبدء جلسة المذاكرة";
    }
</script>

</body>
</html>
